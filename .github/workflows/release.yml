name: Release Runvoice
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег v<версия>, совпадающий с Info.plist'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      WHISPER_VAD_MODEL: ${{ github.workspace }}/.build/vad/ggml-silero-v5.1.2.bin
    steps:
      - name: Validate tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Select Swift toolchain
        run: |
          python3 - <<'PY'
          import glob,os,re
          paths=[p for p in glob.glob('/Applications/Xcode_*.app') if 'beta' not in p.lower()]
          paths.sort(key=lambda p:tuple(map(int,re.findall(r'\d+',p))),reverse=True)
          if not paths:raise SystemExit('Не найден Xcode')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVELOPER_DIR='+paths[0]+'/Contents/Developer\n')
          PY
      - name: Validate metadata and release notes
        run: |
          python3 - <<'PY'
          import os,plistlib
          d=plistlib.load(open('app/Info.plist','rb'))
          assert 'v'+d['CFBundleShortVersionString']==os.environ['RELEASE_TAG'], 'Тег не совпадает с Info.plist'
          assert d['CFBundleVersion']==d['CFBundleShortVersionString'], 'Номера сборки и выпуска должны совпадать'
          PY
          mkdir -p .build
          python3 scripts/release-notes.py > .build/release-notes.txt
          swift --version
      - name: Build and verify both architectures
        run: |
          bash scripts/fetch-vad.sh
          make dmg
          codesign --verify --deep --strict dist/Runvoice-arm64.app
          codesign --verify --deep --strict dist/Runvoice-intel.app
          for image in dist/*.dmg; do hdiutil verify "$image"; done
          cd dist
          for checksum in *.dmg.sha256; do shasum -a 256 -c "$checksum"; done
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Regression tests
        run: |
          for script in bin/dictate.sh scripts/*.sh; do bash -n "$script"; done
          make test-native test-live-hud test-pause test-api test-updates
          arch -x86_64 /bin/bash scripts/test-api.sh
      - name: Preserve bundle signatures and symlinks
        run: tar -cf .build/release-bundles.tar -C dist Runvoice-arm64.app Runvoice-intel.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: |
            .build/release-bundles.tar
          include-hidden-files: true
          retention-days: 7
  sign-and-draft:
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-build
          path: artifacts
      - name: Restore builds
        run: |
          mkdir -p dist .build
          tar -xf artifacts/.build/release-bundles.tar -C dist
          bash scripts/prepare-sparkle.sh
          python3 scripts/release-notes.py > .build/release-notes.txt
      - name: Check signing secrets
        env:
          RUNVOICE_SIGN_P12: ${{ secrets.RUNVOICE_SIGN_P12 }}
          RUNVOICE_SIGN_P12_PASSWORD: ${{ secrets.RUNVOICE_SIGN_P12_PASSWORD }}
        run: |
          test -n "$RUNVOICE_SIGN_P12" || { echo 'Добавьте RUNVOICE_SIGN_P12 в environment release'; exit 1; }
          test -n "$RUNVOICE_SIGN_P12_PASSWORD" || { echo 'Добавьте RUNVOICE_SIGN_P12_PASSWORD в environment release'; exit 1; }
      - name: Import signing certificate
        env:
          RUNVOICE_SIGN_P12: ${{ secrets.RUNVOICE_SIGN_P12 }}
          RUNVOICE_SIGN_P12_PASSWORD: ${{ secrets.RUNVOICE_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/runvoice-signing.keychain-db"
          p12="$RUNNER_TEMP/runvoice-sign.p12"
          password="$(openssl rand -base64 32)"
          printf '%s' "$RUNVOICE_SIGN_P12" | base64 --decode > "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -P "$RUNVOICE_SIGN_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -p codesigning "$keychain" | grep -q '"Runvoice Local Signing"'
      - name: Sign release and build installers
        run: bash scripts/sign-release.sh
      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/runvoice-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/runvoice-sign.p12"
      - name: Sign update archives and feeds
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Добавьте SPARKLE_PRIVATE_KEY в environment release'; exit 1; }
          python3 scripts/prepare-updates.py --notes .build/release-notes.txt
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > .build/release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open(".build/release.json"))["isDraft"], "Опубликованный релиз не изменяется"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Runvoice ${RELEASE_TAG#v}" --notes-file .build/release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.dmg.sha256 dist/updates/* --clobber
